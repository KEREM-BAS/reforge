name: reforge
description: >-
  Flutter upgrade infrastructure. Inspect a Flutter project, plan a migration
  to a target Flutter release, apply it safely and verify the result.
version: 0.1.0-dev
publish_to: none
resolution: workspace

environment:
  sdk: ^3.6.0

executables:
  reforge: reforge
dependencies:
  args: ^2.7.0
  path: ^1.9.1
  reforge_core:
    path: ../reforge_core
dev_dependencies:
  lints: ^6.1.0
  test: ^1.32.0
