name: Release

# Publishes a GitHub release with executables for Linux, macOS and Windows
# when a version tag (v0.1.0, v0.2.0-dev, ...) is pushed. Versions with a
# pre-release suffix are published as pre-releases. See docs/releasing.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart pub get

      - name: Check the tag against the Reforge version and the changelog
        run: |
          version=$(dart run packages/reforge/bin/reforge.dart --version | awk '{print $2}')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Reforge $version (reforgeVersion in packages/reforge_core/lib/reforge_core.dart)."
            exit 1
          fi
          if ! grep -qx "## $version" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section."
            exit 1
          fi

  build:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            asset: reforge-linux-x64
          - os: macos-latest
            asset: reforge-macos-arm64
          - os: windows-latest
            asset: reforge-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart pub get

      - run: dart analyze --fatal-infos

      - run: dart test
        working-directory: packages/reforge_core

      - run: dart test
        working-directory: packages/reforge

      - run: dart compile exe packages/reforge/bin/reforge.dart -o ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and release notes
        run: |
          (cd dist && sha256sum reforge-* > SHA256SUMS && cat SHA256SUMS)
          awk -v heading="## ${GITHUB_REF_NAME#v}" \
            '$0 == heading { found = 1; next } /^## / { found = 0 } found' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "Reforge ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${prerelease[@]}"
