name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed packages
        if: matrix.os == 'ubuntu-latest'
      - run: dart analyze --fatal-infos
      - run: dart test
        working-directory: packages/reforge_core
      - run: dart test
        working-directory: packages/reforge
      - run: dart compile exe packages/reforge/bin/reforge.dart -o reforge-${{ matrix.os }}
